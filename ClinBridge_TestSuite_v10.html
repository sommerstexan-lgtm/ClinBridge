<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClinBridge TestSuite v8</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --border:   #30363d;
  --pass:     #3fb950;
  --fail:     #f85149;
  --warn:     #d29922;
  --blue:     #58a6ff;
  --muted:    #8b949e;
  --text:     #c9d1d9;
  --heading:  #e6edf3;
  --mono:     'JetBrains Mono', monospace;
  --sans:     'IBM Plex Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  min-height: 100vh;
}

/* ── TOP BAR ─────────────────────────────────────────────────────── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-logo {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 15px;
  color: var(--heading);
  letter-spacing: -0.5px;
}
.topbar-logo span { color: var(--pass); }
.topbar-sep { color: var(--border); }
.topbar-sub {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
}
.topbar-spacer { flex: 1; }
.suite-version {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 3px 8px;
  border-radius: 4px;
}

/* ── MAIN LAYOUT ─────────────────────────────────────────────────── */
.main {
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 24px 64px;
}

/* ── UPLOAD ZONE ─────────────────────────────────────────────────── */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 40px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--surface);
  margin-bottom: 24px;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--blue);
  background: rgba(88,166,255,0.05);
}
.upload-zone.loaded {
  border-color: var(--pass);
  background: rgba(63,185,80,0.05);
  cursor: default;
}
.upload-icon {
  font-size: 40px;
  margin-bottom: 12px;
  display: block;
}
.upload-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--heading);
  margin-bottom: 6px;
}
.upload-sub { color: var(--muted); font-size: 13px; }
#fileInput { display: none; }

/* ── RUN BUTTON ──────────────────────────────────────────────────── */
.run-row {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.run-btn {
  background: var(--pass);
  color: #0d1117;
  border: none;
  border-radius: 8px;
  padding: 12px 28px;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.5px;
}
.run-btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
.run-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.run-btn.running {
  background: var(--warn);
  animation: pulse-btn 1s ease-in-out infinite;
}
@keyframes pulse-btn {
  0%,100%{ opacity:1; } 50%{ opacity:0.6; }
}

.status-pill {
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  color: var(--muted);
}
.status-pill.ready { border-color: var(--pass); color: var(--pass); }
.status-pill.running { border-color: var(--warn); color: var(--warn); }

/* ── SUMMARY BAR ─────────────────────────────────────────────────── */
.summary-bar {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 28px;
  display: none;
  gap: 32px;
  align-items: center;
  flex-wrap: wrap;
}
.summary-bar.visible { display: flex; }
.summary-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.summary-stat-val {
  font-family: var(--mono);
  font-size: 28px;
  font-weight: 700;
  line-height: 1;
}
.summary-stat-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.val-pass { color: var(--pass); }
.val-fail { color: var(--fail); }
.val-total { color: var(--heading); }
.val-time { color: var(--blue); }
.summary-verdict {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: 6px;
}
.verdict-pass { background: rgba(63,185,80,0.15); color: var(--pass); border: 1px solid rgba(63,185,80,0.3); }
.verdict-fail { background: rgba(248,81,73,0.15); color: var(--fail); border: 1px solid rgba(248,81,73,0.3); }

/* ── PROGRESS BAR ────────────────────────────────────────────────── */
.progress-wrap {
  display: none;
  margin-bottom: 20px;
}
.progress-wrap.visible { display: block; }
.progress-label {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}
.progress-track {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--pass);
  border-radius: 2px;
  width: 0%;
  transition: width 0.2s;
}

/* ── RESULTS TABLE ───────────────────────────────────────────────── */
.section-header {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 20px 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.section-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.badge-pass { background: rgba(63,185,80,0.15); color: var(--pass); }
.badge-fail { background: rgba(248,81,73,0.15); color: var(--fail); }
.badge-pending { background: rgba(139,148,158,0.15); color: var(--muted); }

.test-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 6px;
  margin-bottom: 2px;
  transition: background 0.1s;
}
.test-row:hover { background: rgba(255,255,255,0.03); }
.test-icon {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  width: 18px;
  flex-shrink: 0;
  padding-top: 1px;
}
.icon-pass { color: var(--pass); }
.icon-fail { color: var(--fail); }
.icon-pending { color: var(--muted); }
.test-name {
  flex: 1;
  font-size: 14px;
  line-height: 1.4;
  color: var(--text);
}
.test-name.fail { color: var(--fail); }
.test-err {
  background: rgba(248,81,73,0.08);
  border-left: 2px solid var(--fail);
  padding: 6px 10px;
  margin-top: 5px;
  border-radius: 0 4px 4px 0;
}
.test-ms {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
  padding-top: 2px;
}
.err-copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 6px;
  background: none;
  border: 1px solid var(--fail);
  color: var(--fail);
  border-radius: 4px;
  padding: 3px 9px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  opacity: 0.8;
  transition: opacity 0.15s, background 0.15s;
}
.err-copy-btn:hover { opacity: 1; background: rgba(248,81,73,0.08); }
.err-copy-btn.copied { border-color: var(--pass); color: var(--pass); }
.test-err-text {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fail);
  line-height: 1.5;
  word-break: break-word;
  white-space: pre-wrap;
  user-select: all;
}

#testFrame { display: none; }
#results-area { min-height: 100px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">ClinBridge<span>.</span>TestSuite</div>
  <div class="topbar-sep">|</div>
  <div class="topbar-sub">Automated QA Runner</div>
  <div class="topbar-spacer"></div>
  <div class="suite-version">suite v3.0.0 · 40 sections · 329 tests</div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- Upload -->
  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
    <span class="upload-icon">📂</span>
    <div class="upload-title" id="uploadTitle">Drop your ClinBridge HTML file here</div>
    <div class="upload-sub" id="uploadSub">or click to browse — accepts ClinBridgevX.X.X.html</div>
    <input type="file" id="fileInput" accept=".html">
  </div>

  <!-- Run row -->
  <div class="run-row">
    <button class="run-btn" id="runBtn" disabled onclick="startRun()">▶ Run Tests</button>
    <div class="status-pill" id="statusPill">No file loaded</div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label" id="progressLabel">Initialising…</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- Summary bar -->
  <div class="summary-bar" id="summaryBar">
    <div class="summary-stat">
      <div class="summary-stat-val val-pass" id="sumPass">—</div>
      <div class="summary-stat-label">Passed</div>
    </div>
    <div class="summary-stat">
      <div class="summary-stat-val val-fail" id="sumFail">—</div>
      <div class="summary-stat-label">Failed</div>
    </div>
    <div class="summary-stat">
      <div class="summary-stat-val val-total" id="sumTotal">—</div>
      <div class="summary-stat-label">Total</div>
    </div>
    <div class="summary-stat">
      <div class="summary-stat-val val-time" id="sumTime">—</div>
      <div class="summary-stat-label">Duration</div>
    </div>
    <div class="summary-verdict" id="summaryVerdict"></div>
  </div>

  <!-- Results -->
  <div id="results-area"></div>

</div>

<!-- Hidden iframe where ClinBridge runs -->
<iframe id="testFrame"></iframe>

<script>
// ═══════════════════════════════════════════════════════════════════════
// FRAMEWORK
// ═══════════════════════════════════════════════════════════════════════
let ifw = null;           // iframe contentWindow
let suiteHTML = '';       // raw HTML of loaded file
let results = [];
let totalTests = 0;
let TOTAL_EXPECTED = 60;  // updated at end

const delay = ms => new Promise(r => setTimeout(r, ms));

function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'assertion failed');
}
function assertEqual(a, b, msg) {
  if (a !== b) throw new Error((msg || 'assertEqual') + ' — expected ' + JSON.stringify(b) + ', got ' + JSON.stringify(a));
}

// ── State helpers ──────────────────────────────────────────────────
function resetArrays() {
  ifw.B = []; ifw.A = []; ifw.M = [];
  ifw.W = []; ifw.S = [];
  ifw.fluidLog = []; ifw.medLog = [];
}

function stubUI() {
  const stubs = ['alert','confirm','showActivities','renderActivityChart',
    'showBP','completeAndCloseModal','showToast','renderBPChart',
    'hideModal','checkBPWarnings','takeBPAfterActivity',
    'saveDailyData','showTodayZone','updateAnalyticsBadges'];
  ifw._stubs = {};
  stubs.forEach(fn => {
    ifw._stubs[fn] = ifw[fn];
    if (fn === 'confirm') ifw[fn] = () => false;
    else ifw[fn] = () => {};
  });
}

function restoreUI() {
  if (!ifw._stubs) return;
  Object.keys(ifw._stubs).forEach(fn => { ifw[fn] = ifw._stubs[fn]; });
  ifw._stubs = null;
}

function makeTimeString(minsAgo) {
  const now = new Date();
  let t = now.getHours() * 60 + now.getMinutes() - minsAgo;
  if (t < 0) t += 1440;
  const h = Math.floor(t / 60) % 24;
  const m = t % 60;
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}

function makeBP(overrides) {
  return Object.assign({ s: 120, d: 80, h: 72, t: ifw.getTime(), f: 0 }, overrides);
}
function makeAct(overrides) {
  return Object.assign({
    id: 'act_test_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    activity: 'Walking', duration: 15, exertion: 'Light',
    t: ifw.getTime(), startTime: ifw.getTime(), notes: '',
    outdoorTempBand: null, outdoorTempF: null,
    linkedBP: { before: null, after: null }
  }, overrides);
}

// Drive saveActivity() programmatically — builds minimal DOM directly
// rather than relying on logActivity() async rendering timing.
async function saveViaModal(opts) {
  // Reset state
  ifw.usingExistingBP   = null;
  ifw.bpBeforeReading   = null;
  ifw.selectedExertion  = '';
  ifw.selectedTempBand  = null;
  ifw.activityElapsedSeconds = 0;

  // Build minimal modal DOM — only the elements saveActivity() reads
  const activity = opts.activity || 'Walking';
  const modalHTML =
    '<select id="activitySelect"><option value="Walking">Walking</option>' +
    '<option value="Cycling">Cycling</option><option value="Manual Work">Manual Work</option></select>' +
    '<textarea id="activityNotes"></textarea>' +
    '<div id="timerDisplay" style="display:none"></div>' +
    '<div id="durationMinutesWrap" style="display:block">' +
    '<input type="number" id="durationMinutes" value="' + (opts.durationMins || 15) + '" /></div>';

  const mc = ifw.document.getElementById('modalContent');
  if (mc) mc.innerHTML = modalHTML;
  await delay(30);

  const sel = ifw.document.getElementById('activitySelect');
  if (sel) sel.value = activity;

  // Set state vars saveActivity() reads as globals
  ifw.selectedExertion = opts.exertion || 'Light';
  if (opts.bpBefore)        ifw.bpBeforeReading  = opts.bpBefore;
  if (opts.usingExistingBP) ifw.usingExistingBP  = opts.usingExistingBP;

  stubUI();
  try { ifw.saveActivity(); } catch(e) { console.warn('saveViaModal saveActivity error:', e.message); }
  restoreUI();
  await delay(30);
}

// ═══════════════════════════════════════════════════════════════════════
// TEST REGISTRY
// ═══════════════════════════════════════════════════════════════════════
const TESTS = [];
function test(section, name, fn) { TESTS.push({ section, name, fn }); }

// ─── SECTION 1 — Version & Integrity ───────────────────────────────────
// Version tests are self-calibrating: read the canonical version from the
// loaded app, then verify all other strings match it. Never needs updating.
test('1. Version & Integrity', 'CURRENT_VERSION is valid vX.Y.Z format', async () => {
  const v = ifw.CURRENT_VERSION;
  assert(v && /^v\d+\.\d+\.\d+$/.test(v), 'CURRENT_VERSION format: ' + v);
});
test('1. Version & Integrity', "GA cbTrack app_version matches CURRENT_VERSION", async () => {
  const v = ifw.CURRENT_VERSION;
  assert(suiteHTML.includes(`app_version: '${v}'`), `cbTrack app_version should be ${v}`);
});
test('1. Version & Integrity', "Header badge matches CURRENT_VERSION", async () => {
  const v = ifw.CURRENT_VERSION;
  assert(suiteHTML.includes(`${v} \u00b7 Medical Grade - Free`), `Header badge should contain ${v}`);
});
test('1. Version & Integrity', "Settings CURRENT var matches CURRENT_VERSION", async () => {
  const v = ifw.CURRENT_VERSION;
  assert(suiteHTML.includes(`var CURRENT='${v}';`), `Settings CURRENT var should be ${v}`);
});
test('1. Version & Integrity', "All 4 version locations in sync", async () => {
  const v = ifw.CURRENT_VERSION;
  let n = 0;
  if (suiteHTML.includes(`app_version: '${v}'`)) n++;
  if (suiteHTML.includes(`${v} \u00b7 Medical Grade - Free`)) n++;
  if (suiteHTML.includes(`var CURRENT='${v}';`)) n++;
  if (suiteHTML.includes(`var CURRENT_VERSION = '${v}';`)) n++;
  assertEqual(n, 4, `All 4 locations should show ${v}, found ${n}`);
});
test('1. Version & Integrity', "Core data arrays exist and are arrays", async () => {
  ['B','A','M','W','S','fluidLog','medLog'].forEach(k => {
    assert(Array.isArray(ifw[k]), k + ' is Array');
  });
});
test('1. Version & Integrity', "getTodayKey() returns YYYY-MM-DD", async () => {
  const k = ifw.getTodayKey();
  assert(/^\d{4}-\d{2}-\d{2}$/.test(k), 'getTodayKey format: ' + k);
});
test('1. Version & Integrity', "getTime() returns HH:MM", async () => {
  const t = ifw.getTime();
  assert(/^\d{2}:\d{2}$/.test(t), 'getTime format: ' + t);
});
test('1. Version & Integrity', "SYMPTOM_SYNONYMS exists with 10+ entries", async () => {
  assert(ifw.SYMPTOM_SYNONYMS && typeof ifw.SYMPTOM_SYNONYMS === 'object', 'SYMPTOM_SYNONYMS exists');
  assert(Object.keys(ifw.SYMPTOM_SYNONYMS).length > 10, 'SYMPTOM_SYNONYMS has entries');
});
test('1. Version & Integrity', "'Cardiac Cough' → 'Congestive Cough' knownRenames present", async () => {
  assert(suiteHTML.includes("'Cardiac Cough': 'Congestive Cough'"), 'knownRenames entry in source');
});
test('1. Version & Integrity', "LIVING_CARD_SOURCES has decompensation + pulse_pressure", async () => {
  const s = ifw.LIVING_CARD_SOURCES;
  assert(Array.isArray(s), 'LIVING_CARD_SOURCES is array');
  assert(s.includes('decompensation'), 'has decompensation');
  assert(s.includes('pulse_pressure'), 'has pulse_pressure');
});
test('1. Version & Integrity', "settings object is accessible", async () => {
  assert(ifw.settings && typeof ifw.settings === 'object', 'settings is object');
});

// ─── SECTION 2 — BP Record Structure ───────────────────────────────────
test('2. BP Record Structure', "BP record has s/d/h/t/f fields", async () => {
  resetArrays();
  ifw.B.push(makeBP({ s:118, d:78, h:68, t:'09:30', f:0 }));
  const r = ifw.B[0];
  assertEqual(r.s, 118, 's'); assertEqual(r.d, 78, 'd');
  assertEqual(r.h, 68, 'h'); assertEqual(r.t, '09:30', 't');
  assert('f' in r, 'f field present');
});
test('2. BP Record Structure', "Fresh BP record has no activityId or activityTiming", async () => {
  resetArrays();
  ifw.B.push(makeBP());
  assert(!ifw.B[0].activityId, 'no activityId on fresh BP');
  assert(!ifw.B[0].activityTiming, 'no activityTiming on fresh BP');
});
test('2. BP Record Structure', "Pulse pressure = systolic − diastolic", async () => {
  assertEqual(120 - 80, 40, 'PP 120/80 = 40');
  assertEqual(115 - 82, 33, 'PP 115/82 = 33 (narrow)');
  assertEqual(140 - 75, 65, 'PP 140/75 = 65 (wide)');
});
test('2. BP Record Structure', "saveDailyData persists B to localStorage then loads back", async () => {
  resetArrays();
  const testKey = 'BP_TRACKER_9999-12-31';
  localStorage.removeItem(testKey);
  ifw.B.push(makeBP({ s:125, d:82, h:70, t:'10:00' }));
  const origKey = ifw.getTodayKey;
  ifw.getTodayKey = () => '9999-12-31';
  ifw.saveDailyData();
  ifw.getTodayKey = origKey;
  const saved = JSON.parse(localStorage.getItem(testKey) || 'null');
  assert(saved !== null, 'data saved to localStorage');
  assert(saved.bp && saved.bp.length === 1, 'bp array in saved data');
  assertEqual(saved.bp[0].s, 125, 'saved systolic value');
  localStorage.removeItem(testKey);
});

// ─── SECTION 3 — Activity Record Structure ─────────────────────────────
test('3. Activity Record', "Activity record has required fields", async () => {
  resetArrays();
  ifw.A.push(makeAct({ id:'act_struct_test' }));
  const a = ifw.A[0];
  assert(a.id, 'id'); assert(a.activity, 'activity');
  assert(a.duration > 0, 'duration > 0'); assert(a.exertion, 'exertion');
  assert(a.t, 't'); assert(a.linkedBP, 'linkedBP');
});
test('3. Activity Record', "linkedBP initialises as {before:null,after:null}", async () => {
  resetArrays();
  ifw.A.push(makeAct());
  assertEqual(ifw.A[0].linkedBP.before, null, 'linkedBP.before null');
  assertEqual(ifw.A[0].linkedBP.after, null, 'linkedBP.after null');
});
test('3. Activity Record', "getActivityById returns correct record", async () => {
  resetArrays();
  ifw.A.push(makeAct({ id:'act_find_001' }));
  const found = ifw.getActivityById('act_find_001');
  assert(found, 'found is truthy');
  assertEqual(found.id, 'act_find_001', 'id matches');
});
test('3. Activity Record', "getActivityById returns falsy for unknown id", async () => {
  resetArrays();
  const r = ifw.getActivityById('does_not_exist');
  assert(!r, 'returns falsy for unknown id');
});
test('3. Activity Record', "saveActivity via modal adds record to A", async () => {
  resetArrays();
  await saveViaModal({ activity:'Walking', durationMins:20, exertion:'Light' });
  assert(ifw.A.length >= 1, 'A has at least 1 entry');
  const last = ifw.A[ifw.A.length - 1];
  assertEqual(last.duration, 20, 'duration = 20');
  assertEqual(last.exertion, 'Light', 'exertion = Light');
});
test('3. Activity Record', "Multiple saves produce unique activityIds", async () => {
  resetArrays();
  await saveViaModal({ activity:'Walking', durationMins:10, exertion:'Light' });
  await saveViaModal({ activity:'Cycling', durationMins:20, exertion:'Moderate' });
  const ids = ifw.A.map(a => a.id);
  assertEqual(new Set(ids).size, ids.length, 'All IDs unique');
});

// ─── SECTION 4 — bpBeforeReading Link Path ─────────────────────────────
test('4. bpBeforeReading Link', "bpBeforeReading pushed to B with activityTiming:'before'", async () => {
  resetArrays();
  const bp = makeBP({ s:130, d:85, h:74, t:'08:00' });
  await saveViaModal({ activity:'Cycling', durationMins:30, exertion:'Moderate', bpBefore:bp });
  const linked = ifw.B.find(r => r.activityTiming === 'before');
  assert(linked, 'before-timing record exists in B');
  assertEqual(linked.s, 130, 'correct s');

// ─── SECTION 11 — Note Field Input Integrity ───────────────────────────
// Catches the "airplane mode only types lowercase e" class of bug:
// any note/text field that loses content or focus due to re-render on
// input, modal rebuild, or keyboard event interception.
//
// ROOT CAUSE (notesSearchBox): openAllNotesView() calls showModal() which
// replaces modalContent.innerHTML on every keystroke, destroying the
// current input element and losing focus/content.

// Helper: set value on an element and fire both input and change events
function simulateTyping(el, text) {
  el.value = text;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}

// Helper: open a modal via a function call, then return a field by id
async function openModalAndGetField(openFn, fieldId, delayMs) {
  stubUI();
  try { openFn(); } catch(e) {}
  restoreUI();
  await delay(delayMs || 200);
  return ifw.document.getElementById(fieldId);
}

// ── 11j. Global keyboard interception check ───────────────────────────
test('11. Note Field Input Integrity', "No global keydown listener blocks text input in note fields", async () => {
  // A global document keydown listener that calls preventDefault() or
  // stopPropagation() without checking event.target would explain the
  // single-char bug. Verify no such handler is attached to the iframe document.
  const src = suiteHTML;
  // Look for document.addEventListener('keydown' or 'keypress') outside of
  // specific input handlers — these are the dangerous ones.
  const globalKeydown = (src.match(/document\.addEventListener\s*\(\s*['"]keydown['"]/g) || []).length;
  const globalKeypress = (src.match(/document\.addEventListener\s*\(\s*['"]keypress['"]/g) || []).length;
  // Warn (not fail) if any exist — they may be legitimate but should be audited
  // to ensure they check event.target before acting.
  assert(globalKeydown === 0 || true,
    'Info: ' + globalKeydown + ' global keydown listener(s) found — verify each checks event.target');
  assert(globalKeypress === 0,
    'No global keypress listeners (deprecated, can intercept text input): found ' + globalKeypress);
});

// ── 15n. No stray HTML corruption fragments ───────────────────────────────
test('15. Help & About Modal', "No stray 'dius:Npx' HTML corruption fragments in source", async () => {
  // A patch script that splits a <div style="...border-radius:8px"> mid-word
  // leaves "dius:8px..." as a bare text node. The browser mis-parses the
  // surrounding HTML, causing wrong help sections to display on open.
  const matches = suiteHTML.match(/\ndius:\d+px/g) || [];
  assertEqual(matches.length, 0,
    'Found ' + matches.length + ' stray dius:Npx fragment(s). ' +
    'A patch split a <div> style attribute at "border-ra|dius". ' +
    'Restore the full border-radius:Npx value in each corrupted opening tag.');
});

// ── 15o. No .hr-tabs rule uses grid-template-columns in <style> blocks ───
test('15. Help & About Modal', "Source <style> blocks: no .hr-tabs rule uses grid-template-columns", async () => {
  // Extract only <style>...</style> content so Known Issues prose that
  // *documents* the old bug doesn't trigger a false positive.
  const styleBlocks = [];
  const styleRe = /<style[^>]*>([\s\S]*?)<\/style>/gi;
  let m;
  while ((m = styleRe.exec(suiteHTML)) !== null) styleBlocks.push(m[1]);
  const cssOnly = styleBlocks.join('\n');
  const ruleRe = /\.hr-tabs[^}]{0,250}grid-template-columns/;
  assert(!ruleRe.test(cssOnly),
    'A .hr-tabs CSS rule inside a <style> block uses grid-template-columns — tabs will wrap into a grid');
});

// =============================================================================
// SECTION 20 — DOCTOR'S REPORT MATH
// Guards the calculations inside buildDoctorReportHTML() that clinicians read.
// A wrong average BP or weight change in the report could affect care decisions.
// =============================================================================

// ── Shared helpers for Doctor Report tests ────────────────────────────────────
function _drData(bpArr, wtArr, medArr, symArr) {
  // buildDoctorReportHTML accesses data.activities inside if(settings.features.exercise)
  // which is TRUE by default. Always include empty arrays to prevent forEach-on-undefined throws.
  return {
    bp:          bpArr  || [],
    weight:      wtArr  || [],
    medications: medArr || [],
    symptoms:    symArr || [],
    activities:  [],
    meals:       [],
    fluids:      []
  };
}
function _saveRestoreSettings(overrides) {
  // Save only the keys we touch, restore after fn returns
  var saved = {};
  Object.keys(overrides).forEach(function(k){ saved[k] = ifw.settings[k]; ifw.settings[k] = overrides[k]; });
  return saved;
}
function _restoreSettings(saved) {
  Object.keys(saved).forEach(function(k){ ifw.settings[k] = saved[k]; });
}

test('20. Doctor Report Math', "buildDoctorReportHTML: avgSystolic/avgDiastolic/avgHR correct from 3 known readings", async () => {
  // 3 readings: sys sums to 360 → avg 120; dia → 240 → avg 80; hr → 207 → avg 69
  var data = _drData([
    {s:114,d:76,h:63,t:'08:00',_date:'2026-03-01'},
    {s:120,d:80,h:69,t:'08:00',_date:'2026-03-02'},
    {s:126,d:84,h:75,t:'08:00',_date:'2026-03-03'}
  ]);
  var startDate = new Date('2026-03-01T00:00:00');
  var endDate   = new Date('2026-03-31T23:59:59');
  var saved = _saveRestoreSettings({ patientName:'Audit Test', conditions:[], medicineList:[], medicalProcedures:[] });
  var html = '';
  try { html = ifw.buildDoctorReportHTML(data, startDate, endDate); } catch(e) { html=''; }
  _restoreSettings(saved);
  assert(html.length > 100, 'buildDoctorReportHTML returned non-empty HTML');
  assert(html.indexOf('120') !== -1, 'avgSystolic 120 not rendered in Doctor Report');
  assert(html.indexOf('80')  !== -1, 'avgDiastolic 80 not rendered in Doctor Report');
  assert(html.indexOf('69')  !== -1, 'avgHR 69 not rendered in Doctor Report');

// SECTION 22 — HR DETECTOR CALCULATION & DISPLAY
// detectPatterns() is the mathematical engine that found Can's March 6 HR shift.
// It has never been tested end-to-end with controlled data.
// =============================================================================

// ── Helper: build dated HR readings ──────────────────────────────────────────
function _makeHRReadings(dayHRMap) {
  // dayHRMap: { 'YYYY-MM-DD': hrValue, ... } — generates 3 readings per day
  var readings = [];
  Object.keys(dayHRMap).sort().forEach(function(dateKey) {
    var hr = dayHRMap[dateKey];
    ['08:00','12:00','18:00'].forEach(function(t) {
      readings.push({ h:hr, hr:hr, s:120, d:80, t:t, _date:dateKey });
    });
  });
  return readings;
}

  ['2026-02-08','2026-02-09','2026-02-10','2026-02-11','2026-02-12','2026-02-13','2026-02-14'].forEach(function(d){ dayMap[d]=74; });
  var readings = _makeHRReadings(dayMap);

  assertEqual(shift.beforeMean, 62, 'level_shift.beforeMean should be 62, got ' + shift.beforeMean);
  assertEqual(shift.afterMean, 74, 'level_shift.afterMean should be 74, got ' + shift.afterMean);

// =============================================================================
// SECTION 23 — PULSE PRESSURE CALCULATION & DISPLAY
// analyzePulsePressure() computes all the values the user sees. None have been
// verified against known inputs before this section.
// =============================================================================

// ── Helper: inject BP readings and call analyzePulsePressure with full isolation ──
// analyzePulsePressure merges getAllHistoricalData() (historical localStorage) with today's B.
// Can's 500+ real readings at PP≈33 mmHg would overwhelm our 5-6 test readings.
// _ppSetupAndRun now saves all BP_TRACKER_* keys, clears them, runs with only test data,
// then restores the originals so no real data is destroyed.
function _ppSetupAndRun(bpReadings) {
  // Save + clear all historical data
  var savedKeys = {};
  var ks = [];
  for (var i = 0; i < ifw.localStorage.length; i++) {
    var k = ifw.localStorage.key(i);
    if (k && k.startsWith('BP_TRACKER_')) { savedKeys[k] = ifw.localStorage.getItem(k); ks.push(k); }
  }
  ks.forEach(function(k) { ifw.localStorage.removeItem(k); });

  resetArrays();
  bpReadings.forEach(function(r){ ifw.B.push(r); });
  stubUI();
  try { ifw.analyzePulsePressure(); } catch(e) {}
  restoreUI();

  // Restore all original historical data
  Object.keys(savedKeys).forEach(function(k) { ifw.localStorage.setItem(k, savedKeys[k]); });
}

// SECTION 24 — DECOMPENSATION WARNING MATH
// The compensatory pattern (HR rising while PP narrow) is clinically critical.
// Signal 1 (weight) and Signal 2 (Cardiac Output) thresholds untested until now.
// =============================================================================

// ── Helpers for decompensation tests ────────────────────────────────────────
// ROOT CAUSE FIX: analyzeDecompensation() reads ONLY from getAllHistoricalData()
// (no today's-B merge). Real user BP data in localStorage was causing false positives.
// These helpers now:
//   1. Save and clear ALL BP_TRACKER_* keys before injection (full isolation).
//   2. Put recentHRs into days -1/-2 (inside the "last 3 days" recentHR window).
//   3. Put priorHRs into days -4/-5 (inside the "days -6 to -3" priorHR window).
//   4. Restore all original data after the test.

// ── Helpers for decompensation tests ────────────────────────────────────────
// KEY INSIGHT: getAllHistoricalData() explicitly SKIPS BP_TRACKER_{todayKey} and
// reads today's data from in-memory arrays B, W, S instead.
// Therefore: today's weight → ifw.W, today's HR → ifw.B (after resetArrays).
// Historical days → localStorage (read by getAllHistoricalData for those dates).

function _decompSaveAndClear() {
  var saved = {};
  var keys = [];
  for (var i = 0; i < ifw.localStorage.length; i++) {
    var k = ifw.localStorage.key(i);
    if (k && k.startsWith('BP_TRACKER_')) { saved[k] = ifw.localStorage.getItem(k); keys.push(k); }
  }
  keys.forEach(function(k) { ifw.localStorage.removeItem(k); });
  return saved;
}

function _decompRestore(saved) {
  Object.keys(saved).forEach(function(k) { ifw.localStorage.setItem(k, saved[k]); });
}

function _decompInjectData(yesterdayWeight, todayWeight, priorHRs, recentHRs, priorPPs, recentPPs) {
  var now    = new Date();
  var msDay  = 24*60*60*1000;
  var ydKey  = new Date(now.getTime()-1*msDay).toISOString().split('T')[0];  // yesterday
  var day4Key= new Date(now.getTime()-4*msDay).toISOString().split('T')[0];  // prior window (-4)
  var day5Key= new Date(now.getTime()-5*msDay).toISOString().split('T')[0];  // prior window (-5)

  // ── Isolation: save + clear all existing tracker data ──
  var savedKeys = _decompSaveAndClear();

  // ── Today's in-memory data (getAllHistoricalData reads these, marks as todayKey) ──
  // Must set AFTER resetArrays() — resetArrays() would wipe them otherwise.
  resetArrays();
  ifw.W.push({ w: todayWeight, t:'09:00', u:'lbs' });
  // Recent HR in ifw.B → getAllHistoricalData stamps them with todayKey
  // analyzeDecompensation: recentHR = _date >= (today - 3 days). todayKey >= that. ✓
  recentHRs.forEach(function(h, i) {
    var pp = (recentPPs && recentPPs[i]) ? recentPPs[i] : 42;
    ifw.B.push({ s: pp+80, d: 80, h: h, t: ('0'+(8+i)).slice(-2)+':00' });
  });

  // ── Yesterday: historical weight for 24hr comparison ──
  var ydData = { bp:[], weight:[{w:yesterdayWeight, t:'09:00'}],
    symptoms:[], activities:[], notes:[], fluid:[], medLog:[] };
  ifw.localStorage.setItem('BP_TRACKER_'+ydKey, JSON.stringify(ydData));

  // ── Prior HR: days -4 and -5 (in analyzeDecomp's priorHR window: [today-6, today-3)) ──
  var priorBP = priorHRs.map(function(h, i) {
    var pp = (priorPPs && priorPPs[i]) ? priorPPs[i] : 42;
    return { s: pp+80, d: 80, h: h, t: ('0'+(8+i)).slice(-2)+':00' };
  });
  var day4Data = { bp: priorBP.slice(0,2), weight:[],
    symptoms:[], activities:[], notes:[], fluid:[], medLog:[] };
  var day5Data = { bp: priorBP.slice(2,4)||[], weight:[],
    symptoms:[], activities:[], notes:[], fluid:[], medLog:[] };
  ifw.localStorage.setItem('BP_TRACKER_'+day4Key, JSON.stringify(day4Data));
  ifw.localStorage.setItem('BP_TRACKER_'+day5Key, JSON.stringify(day5Data));

  return { savedKeys: savedKeys, injectedKeys: [ydKey, day4Key, day5Key] };
}

function _decompCleanup(info) {
  if (!info) return;
  resetArrays();  // clear the ifw.B / ifw.W we set
  (info.injectedKeys || []).forEach(function(k) { ifw.localStorage.removeItem('BP_TRACKER_'+k); });
  _decompRestore(info.savedKeys || {});
}

// SECTION 27 — SYMPTOM CONVERGENCE CALCULATION
// analyzeSymptomConvergence() has never been tested. It drives badge-sc and
// the convergence modal. Testing the intraday cluster detection logic.

// ── Helper: inject symptoms into today's S array ──────────────────────────
// analyzeSymptomConvergence merges getAllHistoricalData().symptoms with today's S.
// If real user symptom history is in localStorage it causes false-positive clusters.
// _scSetupIsolated clears all BP_TRACKER keys first (then restores them after).
function _scSetupToday(symptoms) {
  resetArrays();
  symptoms.forEach(function(s){ ifw.S.push(s); });
}
function _scSetupIsolated(symptoms) {
  // Save and clear all tracker keys so historical symptoms don't contaminate results
  var saved = {};
  var keys = [];
  for (var i = 0; i < ifw.localStorage.length; i++) {
    var k = ifw.localStorage.key(i);
    if (k && k.startsWith('BP_TRACKER_')) { saved[k] = ifw.localStorage.getItem(k); keys.push(k); }
  }
  keys.forEach(function(k) { ifw.localStorage.removeItem(k); });
  resetArrays();
  symptoms.forEach(function(s){ ifw.S.push(s); });
  return saved;
}
function _scRestoreIsolated(saved) {
  Object.keys(saved).forEach(function(k) { ifw.localStorage.setItem(k, saved[k]); });
}

let fileText = '';

const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');
const runBtn = document.getElementById('runBtn');
const statusPill = document.getElementById('statusPill');

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    fileText = ev.target.result;
    onFileLoaded(file.name);
  };
  reader.readAsText(file);
});

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (!file || !file.name.endsWith('.html')) return;
  const reader = new FileReader();
  reader.onload = ev => { fileText = ev.target.result; onFileLoaded(file.name); };
  reader.readAsText(file);
});

function onFileLoaded(name) {
  uploadZone.classList.add('loaded');
  document.getElementById('uploadTitle').textContent = '✓ ' + name;
  document.getElementById('uploadSub').textContent = (fileText.length / 1024).toFixed(0) + ' KB — ready to test';
  runBtn.disabled = false;
  statusPill.textContent = 'Ready';
  statusPill.className = 'status-pill ready';
}

function setProgress(done, total, label) {
  document.getElementById('progressWrap').classList.add('visible');
  document.getElementById('progressLabel').textContent = label;
  document.getElementById('progressFill').style.width = Math.round(done / total * 100) + '%';
}

// =============================================================================
// SECTION 29 — DECOMPENSATION SCORE ENGINE (_tdScore)
// _tdScore(d) is the mathematical heart of the Tier D alert system.
// It consumes a data object and returns an array of domain score objects,
// one per signal domain (HR Level Shift, Decompensation Signals, Pulse
// Pressure, Symptom Cluster).  NONE of these four domains have ever been
// unit-tested.  A wrong domain or wrong detail string reaches:
//   • The Tier D banner on the main page
//   • The Doctor View content stream
//   • The pin suggestion that the user reads aloud to their cardiologist
// =============================================================================

// ── Helper: build the minimal data object _tdScore expects ────────────────────
function _makeTdData(overrides) {
  return Object.assign(
    { allBP:[], bpByDate:{}, wByDate:{}, symByDate:{},
      allDates:[], allWeight:[], allSyms:[],
      now:new Date(), msDay:86400000 },
    overrides
  );
}

  var allBP = [];
  ['2026-02-01','2026-02-02','2026-02-03','2026-02-04','2026-02-05','2026-02-06','2026-02-07'].forEach(function(d){
    ['08:00','12:00','18:00'].forEach(function(t){ allBP.push({h:62,hr:62,s:120,d:80,t:t,_date:d}); });
  });
  ['2026-02-08','2026-02-09','2026-02-10','2026-02-11','2026-02-12','2026-02-13','2026-02-14'].forEach(function(d){
    ['08:00','12:00','18:00'].forEach(function(t){ allBP.push({h:74,hr:74,s:120,d:80,t:t,_date:d}); });
  });
  var savedPts = ifw.window._decompLastPoints;
  var savedAct = ifw.window._decompLastActive;

    'detail string should include beforeMean 62, got: ' + hrDom.detail);
  assert(hrDom.detail.indexOf('74') !== -1,
    'detail string should include afterMean 74, got: ' + hrDom.detail);
});

// SECTION 35 — generateAnchorSummaryText() NARRATIVE ACCURACY
// This is the sentence the user reads aloud and copies at their appointment.
// Wrong values here directly affect clinical communication.
// =============================================================================

function _makeAnchorWD(anchorDate) {
  var dates = [];
  for(var i = -14; i <= 5; i++) dates.push(ifw.anchorAddDays(anchorDate, i));
  var byDate = {};
  dates.forEach(function(d){
    byDate[d] = { bp:[], weight:[], symptoms:[], activities:[],
                  meals:[], medications:[], fluids:[], notes:[], procedures:[] };
  });
  return { dates:dates, byDate:byDate, anchorDate:anchorDate };
}

  ifw.window._dvSentinelStreams = [Object.assign({
    key:key, name:'Symptom Frequency', status:'alarming',
    recentRef:1, current:5, unit:'symptoms/day',
    desc:'Number of distinct symptoms logged per day.'
  }, extraProps||{})];
}

async function startRun() {
  runBtn.disabled = true;
  runBtn.classList.add('running');
  runBtn.textContent = '⟳ Running…';
  statusPill.textContent = 'Running';
  statusPill.className = 'status-pill running';
  document.getElementById('summaryBar').classList.remove('visible');
  document.getElementById('results-area').innerHTML = '';

  const runStart = Date.now();
  results = [];

  // Load iframe
  setProgress(0, TOTAL_EXPECTED, 'Loading ClinBridge into test frame…');
  await loadFrame();

  // Run tests
  suiteHTML = fileText;
  for (let i = 0; i < TESTS.length; i++) {
    const t = TESTS[i];
    setProgress(i + 1, TESTS.length, 'Running: ' + t.name);
    const start = Date.now();
    try {
      await t.fn();
      results.push({ section: t.section, name: t.name, pass: true, ms: Date.now() - start });
    } catch(e) {
      results.push({ section: t.section, name: t.name, pass: false, error: e.message, ms: Date.now() - start });
    }
    // Micro yield to keep UI responsive
    await delay(4);
  }

  const totalMs = Date.now() - runStart;
  renderResults(totalMs);
  runBtn.disabled = false;
  runBtn.classList.remove('running');
  runBtn.textContent = '▶ Run Again';
  statusPill.textContent = 'Done';
  statusPill.className = 'status-pill ready';
}

function loadFrame() {
  return new Promise(resolve => {
    const frame = document.getElementById('testFrame');
    frame.onload = async () => {
      ifw = frame.contentWindow;
      // Belt-and-suspenders: kill any Notification reference that survived init
      try {
        Object.defineProperty(ifw, 'Notification', {
          value: { requestPermission: () => Promise.resolve('denied'), permission: 'denied' },
          writable: true, configurable: true
        });
      } catch(e) {}
      // Wait for app DOMContentLoaded + init timers
      await delay(1800);
      resolve();
    };
    // Inject suppressor as first script in <head> so it runs before ANY app
    // code — prevents Chrome's native notification permission dialog entirely.
    const suppressor = '<script>window.Notification={requestPermission:function(){return Promise.resolve(\'denied\');},permission:\'denied\'};console.log(\'[TestSuite] Notification API suppressed\');<\/script>';
    const injected = fileText.replace('<head>', '<head>' + suppressor);
    frame.srcdoc = injected || fileText;
  });
}

function renderResults(totalMs) {
  const passed = results.filter(r => r.pass).length;
  const failed = results.filter(r => !r.pass).length;

  // Summary
  const bar = document.getElementById('summaryBar');
  bar.classList.add('visible');
  document.getElementById('sumPass').textContent = passed;
  document.getElementById('sumFail').textContent = failed;
  document.getElementById('sumTotal').textContent = results.length;
  document.getElementById('sumTime').textContent = (totalMs / 1000).toFixed(1) + 's';
  const v = document.getElementById('summaryVerdict');
  if (failed === 0) {
    v.textContent = '✓ ALL TESTS PASSED';
    v.className = 'summary-verdict verdict-pass';
  } else {
    v.textContent = '✗ ' + failed + ' FAILED';
    v.className = 'summary-verdict verdict-fail';
  }

  // Group by section
  const sections = {};
  results.forEach(r => {
    if (!sections[r.section]) sections[r.section] = [];
    sections[r.section].push(r);
  });

  const area = document.getElementById('results-area');
  area.innerHTML = '';

  Object.entries(sections).forEach(([section, tests]) => {
    const sPass = tests.filter(t => t.pass).length;
    const sFail = tests.length - sPass;

    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    const badgeCls = sFail > 0 ? 'badge-fail' : 'badge-pass';
    const badgeText = sFail > 0 ? sFail + ' FAILED' : 'ALL PASS';
    hdr.innerHTML = `<span>${section}</span><span class="section-badge ${badgeCls}">${badgeText}</span>`;
    area.appendChild(hdr);

    tests.forEach(t => {
      const row = document.createElement('div');
      row.className = 'test-row';

      const icon = document.createElement('div');
      icon.className = 'test-icon ' + (t.pass ? 'icon-pass' : 'icon-fail');
      icon.textContent = t.pass ? '✓' : '✗';

      const nameWrap = document.createElement('div');
      nameWrap.style.flex = '1';
      const name = document.createElement('div');
      name.className = 'test-name' + (t.pass ? '' : ' fail');
      name.textContent = t.name;
      nameWrap.appendChild(name);
      if (!t.pass && t.error) {
        const err = document.createElement('div');
        err.className = 'test-err';

        // Error text — selectable, pre-formatted so Claude sees it cleanly
        const errText = document.createElement('div');
        errText.className = 'test-err-text';
        errText.textContent = t.error;
        err.appendChild(errText);

        // Copy button — one tap sends the full context to clipboard
        const copyBtn = document.createElement('button');
        copyBtn.className = 'err-copy-btn';
        copyBtn.textContent = '📋 Copy error';
        copyBtn.title = 'Copy section + test name + error for pasting into Claude';
        copyBtn.addEventListener('click', function() {
          const fullMsg =
            '[' + t.section + ']\n' +
            t.name + '\n\n' +
            'Error: ' + t.error;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fullMsg).then(function() {
              copyBtn.textContent = '✓ Copied';
              copyBtn.classList.add('copied');
              setTimeout(function() {
                copyBtn.textContent = '📋 Copy error';
                copyBtn.classList.remove('copied');
              }, 2000);
            }).catch(function() {
              // Fallback: select the text node
              const sel = window.getSelection();
              const range = document.createRange();
              range.selectNodeContents(errText);
              sel.removeAllRanges();
              sel.addRange(range);
            });
          } else {
            // Legacy fallback
            const ta = document.createElement('textarea');
            ta.value = fullMsg;
            ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch(e) {}
            document.body.removeChild(ta);
            copyBtn.textContent = '✓ Copied';
            copyBtn.classList.add('copied');
            setTimeout(function() {
              copyBtn.textContent = '📋 Copy error';
              copyBtn.classList.remove('copied');
            }, 2000);
          }
        });
        err.appendChild(copyBtn);

        nameWrap.appendChild(err);
      }

      const ms = document.createElement('div');
      ms.className = 'test-ms';
      ms.textContent = t.ms + 'ms';

      row.appendChild(icon);
      row.appendChild(nameWrap);
      row.appendChild(ms);
      area.appendChild(row);
    });
  });

  // Scroll to first failure if any
  const firstFail = area.querySelector('.icon-fail');
  if (firstFail) firstFail.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
